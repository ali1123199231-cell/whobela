services:
  ask-router:
    build: ./ask-router
    container_name: shared-ask-router
    restart: unless-stopped
    expose:
      - "8081"
      - "8082"
    networks:
      - shared-edge-net

  caddy:
    # Built locally rather than pulled: the stock image has no DNS providers,
    # and *.whobela.com's certificate can only be issued over DNS-01. See
    # ./Dockerfile.
    build: .
    image: shared-caddy-cloudflare:2
    container_name: shared-caddy
    restart: unless-stopped
    environment:
      # Cloudflare token restricted to Zone:DNS:Edit on the whobela.com zone,
      # used only to write the _acme-challenge TXT record. Lives in
      # /opt/shared-caddy/.env on the server; never committed.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in /opt/shared-caddy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      # Static sites served directly by Caddy rather than proxied to an app —
      # currently ocroon.com (see conf.d/ocroon.caddy, which roots at
      # /srv/sites/ocroon.com). Without this the vhost answers 404 for
      # everything, so keep it whenever this file is copied to the server.
      - /opt/sites:/srv/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-edge-net
    depends_on:
      - ask-router

networks:
  shared-edge-net:
    name: shared-edge-net
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
